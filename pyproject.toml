[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "microduck-ppo"
version = "0.1.0"
description = "PPO balance control for the MicroDuck on a tilted, non-uniformly rotating platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29,<1.2",
  "numpy>=1.26,<3",
  "stable-baselines3>=2.3,<3",
  "torch>=2.2,<2.3",
  "matplotlib>=3.8,<4",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.5,<1",
  "pillow>=10,<13",
  "tensorboard>=2.16,<3",
  "mujoco==3.3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
microduck-train = "microduck_ppo.train:main"
microduck-evaluate = "microduck_ppo.evaluate:main"
microduck-visualize = "microduck_ppo.visualize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_ppo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
